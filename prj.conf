# Zephyr config for nRF52840 KWS firmware.

# Core
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=y

# Optimize for speed (-O2). Default -Os makes the int8 conv kernels and DFT
# 2-3× slower than necessary. -O2 is the right pick for a real-time KWS path.
CONFIG_SPEED_OPTIMIZATIONS=y

# Peripherals
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# Logging via RTT (USB-UART optional). Use RTT for low overhead.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Math + FPU (Cortex-M4F)
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# CMSIS-DSP (FFT) + CMSIS-NN (conv accel)
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_NN=y

# Power: keep simple — no PM yet.
CONFIG_PM=n

# Stack overflow guard
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_STACK_INFO=y




#
# Copyright (c) 2018 Nordic Semiconductor
#
# SPDX-License-Identifier: LicenseRef-Nordic-5-Clause
#
CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_LBS"

# Enable the LBS service
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# STEP 2.2 - Enable FOTA over Bluetooth LE
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
